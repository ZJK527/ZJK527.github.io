<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZJK527 · Personal Site</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0f2f5;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 60px 50px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
        }

        .avatar {
            font-size: 72px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 32px;
            font-weight: 600;
            color: #1d1d1f;
        }

        .bio {
            font-size: 16px;
            color: #6e6e73;
            margin: 12px 0 20px;
        }

        .btn {
            display: inline-block;
            background: #1d1d1f;
            color: white;
            padding: 10px 28px;
            border-radius: 40px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #3a3a3c;
        }

        .links {
            margin-top: 24px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .links a {
            color: #6e6e73;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }

        .links a:hover {
            color: #1d1d1f;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">🚀</div>
        <h1>ZJK527</h1>
        <p class="bio">Learning Web Development · Exploring the world of code</p>
        <a href="https://github.com/ZJK527?tab=repositories" class="btn">My Projects</a>
        <div class="links">
            <a href="https://github.com/" target="_blank">GitHub</a>
            <a href="https://github.com/ZJK527">About Me</a>
        </div>
    </div>
</body>
</html>
