<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZJK527 · 个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 50px 45px 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.20);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .avatar {
            font-size: 80px;
            margin-bottom: 8px;
            display: block;
        }

        h1 {
            font-size: 30px;
            font-weight: 700;
            color: #1d1d1f;
            letter-spacing: -0.5px;
        }

        .badge {
            display: inline-block;
            background: #f0f0f5;
            color: #6e6e73;
            font-size: 13px;
            font-weight: 500;
            padding: 4px 16px;
            border-radius: 40px;
            margin: 8px 0 14px;
        }

        .bio {
            font-size: 16px;
            color: #6e6e73;
            line-height: 1.6;
            margin-bottom: 22px;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 28px;
        }

        .btn {
            display: inline-block;
            background: #1d1d1f;
            color: white;
            padding: 10px 28px;
            border-radius: 40px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.25s ease;
            border: none;
            cursor: pointer;
        }

        .btn-outline {
            background: transparent;
            color: #1d1d1f;
            border: 1.5px solid #1d1d1f;
        }

        .btn:hover {
            background: #3a3a3c;
            transform: scale(1.02);
        }

        .btn-outline:hover {
            background: #1d1d1f;
            color: white;
        }

        .links {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            border-top: 1px solid #e5e5ea;
            padding-top: 24px;
        }

        .links a {
            color: #6e6e73;
            text-decoration: none;
            font-size: 14px;
            font-weight: 450;
            transition: color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .links a:hover {
            color: #1d1d1f;
        }

        .footer-note {
            margin-top: 20px;
            font-size: 12px;
            color: #aeaeb2;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="avatar">🧑‍💻</span>
        <h1>ZJK527</h1>
        <span class="badge">🚀 全栈开发学习中</span>
        <p class="bio">
            热爱编程 · 持续探索 · 用代码构建想法
        </p>
        <div class="btn-group">
            <a href="#" class="btn">📂 我的项目</a>
            <a href="#" class="btn btn-outline">📝 写文章</a>
        </div>
        <div class="links">
            <a href="https://github.com/ZJK527" target="_blank">🐙 GitHub</a>
            <a href="#">📧 联系我</a>
            <a href="#">📖 关于</a>
        </div>
        <div class="footer-note">
            ✨ 用 GitHub Pages 搭建
        </div>
    </div>
</body>
</html>
